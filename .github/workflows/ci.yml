name: SifoBooks CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run scripts/standalone-check.ts

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
