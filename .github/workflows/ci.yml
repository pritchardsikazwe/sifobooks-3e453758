name: SifoBooks CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Production readiness QA
        run: bun run qa:production

      - name: Tests
        run: bun run test

      - name: Business workflow QA
        run: bun run test:business-qa

      - name: Database workflow QA
        run: bun run test:database-qa

      - name: Standalone edition workflow QA
        run: bun run test:standalone-workflows

      - name: Standalone transaction and report QA
        run: bun run test:standalone-transactions

      - name: Backup and restore QA
        run: bun run test:backup-restore-qa

      - name: Production build
        run: bun run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        edition: [enterprise, accounting, retail, restaurant, hotel, school, property, lending, payroll]
    runs-on: windows-latest
    env:
      SIFOBOOKS_EDITION: ${{ matrix.edition }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Install ImageMagick before desktop build
        shell: pwsh
        run: choco install imagemagick.app --no-progress -y

      - name: Build Windows desktop package
        run: bun run build:desktop

      - name: Create small portable Windows ZIP
        shell: pwsh
        run: |
          $portable = "portable-dist"
          if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item -Path "desktop-dist\\*" -Destination $portable -Recurse -Force
          # Keep the portable package small by using the WebView2 Runtime already
          # installed on most supported Windows 10/11 machines. The full offline
          # WebView2 runtime remains bundled in the branded installer.
          $runtime = Join-Path $portable "WebView2Runtime"
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          Compress-Archive -Path "$portable\\*" -DestinationPath "SifoBooks-${{ matrix.edition }}-Windows-Portable-Small.zip" -CompressionLevel Optimal -Force

      - name: Upload small portable Windows package
        id: upload-portable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-${{ matrix.edition }}-Windows-Portable-Small
          path: SifoBooks-${{ matrix.edition }}-Windows-Portable-Small.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report portable upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-portable.outcome }}" -eq "success") {
            Write-Host "Small portable Windows package uploaded successfully."
          } else {
            Write-Warning "Small portable package was built, but GitHub artifact upload was unavailable."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build branded Windows installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build-installer.ps1

      # The branded installer is the supported customer distribution.
      # Do not upload a duplicate portable ZIP to Actions artifacts.
      - name: Upload branded Windows installer
        id: upload-installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-${{ matrix.edition }}-Windows-Setup
          path: installer-dist/SifoBooks-${{ matrix.edition }}-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Report artifact upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-installer.outcome }}" -eq "success") {
            Write-Host "Windows installer uploaded successfully."
          } else {
            Write-Warning "Windows installer build completed, but GitHub artifact upload was unavailable."
          }
  vsdc-connector:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build VSDC connector
        run: bun run build:vsdc-connector
      - name: Create VSDC connector ZIP
        shell: pwsh
        run: Compress-Archive -Path vsdc-connector-dist\* -DestinationPath SifoBooks-VSDC-Connector-Windows.zip -Force
      - name: Upload VSDC connector
        id: upload-vsdc
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-VSDC-Connector-Windows
          path: SifoBooks-VSDC-Connector-Windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report VSDC artifact upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-vsdc.outcome }}" -eq "success") {
            Write-Host "VSDC connector uploaded successfully."
          } else {
            Write-Warning "VSDC connector built successfully, but GitHub artifact upload was unavailable."
          }
