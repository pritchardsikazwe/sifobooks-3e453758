name: SifoBooks CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Build Windows desktop package
        run: bun run build:desktop

      - name: Create portable Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path desktop-dist\\* -DestinationPath SifoBooks-Windows-Portable.zip -Force

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-Windows-Portable
          path: SifoBooks-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: iscc installer/SifoBooks.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-Windows-Installer
          path: installer-dist/SifoBooks-Setup.exe
          if-no-files-found: error
          retention-days: 14
