name: SifoBooks CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Production readiness QA
        run: bun run qa:production

      - name: Tests
        run: bun run test

      - name: Business workflow QA
        run: bun run test:business-qa

      - name: Database workflow QA
        run: bun run test:database-qa

      - name: Windows schema QA
        run: bun run test:windows-schema-qa
      - name: Inventory synchronization QA
        run: bun run test:inventory-sync-qa


      - name: Standalone edition workflow QA
        run: bun run test:standalone-workflows

      - name: Standalone transaction and report QA
        run: bun run test:standalone-transactions

      - name: Backup and restore QA
        run: bun run test:backup-restore-qa

      - name: Production build
        run: bun run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        edition: [enterprise, accounting, retail, restaurant, hotel, school, property, lending, payroll]
    runs-on: windows-latest
    env:
      SIFOBOOKS_EDITION: ${{ matrix.edition }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Windows schema QA
        run: bun run test:windows-schema-qa

      - name: Install ImageMagick before desktop build
        shell: pwsh
        run: choco install imagemagick.app --no-progress -y

      - name: Build Windows desktop package
        run: bun run build:desktop

      - name: Create small portable Windows ZIP
        shell: pwsh
        run: |
          $portable = "portable-dist"
          if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item -Path "desktop-dist\\*" -Destination $portable -Recurse -Force
          # Keep the portable package small by using the WebView2 Runtime already
          # installed on most supported Windows 10/11 machines. The full offline
          Compress-Archive -Path "$portable\\*" -DestinationPath "SifoBooks-${{ matrix.edition }}-Windows-Portable-Small.zip" -CompressionLevel Optimal -Force

      - name: Upload small portable Windows package
        id: upload-portable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-${{ matrix.edition }}-Windows-Portable-Small
          path: SifoBooks-${{ matrix.edition }}-Windows-Portable-Small.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report portable upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-portable.outcome }}" -eq "success") {
            Write-Host "Small portable Windows package uploaded successfully."
          } else {
            Write-Warning "Small portable package was built, but GitHub artifact upload was unavailable."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build branded Windows installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build-installer.ps1

      # The branded installer is the supported customer distribution.
      # Do not upload a duplicate portable ZIP to Actions artifacts.
      - name: Upload branded Windows installer
        id: upload-installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-${{ matrix.edition }}-Windows-Setup
          path: installer-dist/SifoBooks-${{ matrix.edition }}-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Report artifact upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-installer.outcome }}" -eq "success") {
            Write-Host "Windows installer uploaded successfully."
          } else {
            Write-Warning "Windows installer build completed, but GitHub artifact upload was unavailable."
          }

  vsdc-connector:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build VSDC connector
        run: bun run build:vsdc-connector
      - name: Create VSDC connector ZIP
        shell: pwsh
        run: Compress-Archive -Path vsdc-connector-dist\\* -DestinationPath SifoBooks-VSDC-Connector-Windows.zip -Force
      - name: Upload VSDC connector
        id: upload-vsdc
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-VSDC-Connector-Windows
          path: SifoBooks-VSDC-Connector-Windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report artifact upload status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.upload-vsdc.outcome }}" -eq "success") {
            Write-Host "VSDC connector uploaded successfully."
          } else {
            Write-Warning "VSDC connector built successfully, but GitHub artifact upload was unavailable."
          }

  # Cloud gate: migrations, idempotency, and tenant-isolation security QA.
  cloud-postgres-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sifobooks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sifobooks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sifobooks"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      POSTGRES_URL: postgres://postgres:sifobooks_ci@127.0.0.1:5432/sifobooks
      POSTGRES_TLS: "false"
      JWT_SECRET: ci-only-sifobooks-cloud-jwt-secret-32-bytes-minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Cloud PostgreSQL migrations
        run: bun run cloud:migrate

      - name: Re-run Cloud migrations (idempotency)
        run: bun run cloud:migrate

      - name: Create non-superuser request-path role
        env:
          PGPASSWORD: sifobooks_ci
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/sifobooks" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sifobooks_app') THEN
              CREATE ROLE sifobooks_app LOGIN PASSWORD 'sifobooks_app_ci';
            ELSE
              ALTER ROLE sifobooks_app WITH LOGIN PASSWORD 'sifobooks_app_ci';
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE sifobooks TO sifobooks_app;
          GRANT USAGE ON SCHEMA public TO sifobooks_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sifobooks_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sifobooks_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO sifobooks_app;

          DROP TABLE IF EXISTS sifobooks_rls_probe;
          CREATE TABLE sifobooks_rls_probe (
            id text PRIMARY KEY,
            tenant_id uuid NOT NULL,
            value text NOT NULL
          );
          ALTER TABLE sifobooks_rls_probe ENABLE ROW LEVEL SECURITY;
          ALTER TABLE sifobooks_rls_probe FORCE ROW LEVEL SECURITY;
          CREATE POLICY sifobooks_rls_probe_policy ON sifobooks_rls_probe
            FOR ALL
            USING (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid)
            WITH CHECK (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid);
          GRANT SELECT, INSERT, UPDATE, DELETE ON sifobooks_rls_probe TO sifobooks_app;
          SQL

      - name: Run Cloud security QA as request-path role
        env:
          POSTGRES_URL: postgresql://sifobooks_app:sifobooks_app_ci@127.0.0.1:5432/sifobooks
        run: bun run check:cloud-security
