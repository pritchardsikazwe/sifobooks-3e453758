name: SifoBooks CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Production readiness QA
        run: bun run qa:production

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        edition: [enterprise, accounting, retail, restaurant, hotel, school]
    runs-on: windows-latest
    env:
      SIFOBOOKS_EDITION: ${{ matrix.edition }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standalone dependency check
        run: bun run check:standalone

      - name: Build Windows desktop package
        run: bun run build:desktop

      - name: Create portable Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path desktop-dist\\* -DestinationPath SifoBooks-${{ matrix.edition }}-Windows-Portable.zip -Force

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-${{ matrix.edition }}-Windows-Portable
          path: SifoBooks-${{ matrix.edition }}-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
  vsdc-connector:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build VSDC connector
        run: bun run build:vsdc-connector
      - name: Create VSDC connector ZIP
        shell: pwsh
        run: Compress-Archive -Path vsdc-connector-dist\* -DestinationPath SifoBooks-VSDC-Connector-Windows.zip -Force
      - name: Upload VSDC connector
        uses: actions/upload-artifact@v4
        with:
          name: SifoBooks-VSDC-Connector-Windows
          path: SifoBooks-VSDC-Connector-Windows.zip
          if-no-files-found: error
          retention-days: 30
