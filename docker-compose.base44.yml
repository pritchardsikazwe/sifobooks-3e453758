services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - db_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - .env
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 3000"

volumes:
  db_data:
