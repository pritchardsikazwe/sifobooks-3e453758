services:
  web:
    # Bun runtime — matches the project's packageManager (bun@1.3.14).
    # Plain base image (no baked app code) so live edits show via Vite HMR.
    image: oven/bun:1.3.14
    working_dir: /app
    volumes:
      # Bind-mount the cloned source so edits hot-reload without rebuilds.
      - ./:/app
      # Keep installed deps off the host; persists across restarts.
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview origin is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "bun install && bun run dev -- --port 3000 --host 0.0.0.0"
    restart: unless-stopped

volumes:
  node_modules:
